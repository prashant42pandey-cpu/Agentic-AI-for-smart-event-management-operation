{% extends "base.html" %}

{% block title %}Send Notification — Admin{% endblock %}

{% block extra_css %}
<style>
    .form-wrapper {
        background: linear-gradient(145deg, #f0f4ff 0%, #e6edf7 100%);
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 0;
        border-radius: 2rem;
    }

    .form-card {
        border: none;
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        box-shadow: 0 20px 60px rgba(13, 110, 253, 0.12);
        overflow: hidden;
    }

    .form-card .card-header {
        background: linear-gradient(135deg, #0d6efd, #0dcaf0);
        color: white;
        padding: 1.8rem 2rem;
        text-align: center;
        border: none;
    }

    .form-floating {
        margin-bottom: 1.25rem;
    }

    .form-floating > .form-control,
    .form-floating > .form-select {
        border-radius: 1rem;
        border: 2px solid #e9ecef;
        background: #f8f9fa;
    }

    .form-floating > .form-control:focus,
    .form-floating > .form-select:focus {
        border-color: #0d6efd;
        background: white;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
    }
</style>
{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="card form-card">
                    <div class="card-header">
                        <i class="bi bi-send fs-1 mb-2"></i>
                        <h3 class="fw-bold mb-1">Compose Notification</h3>
                        <p class="mb-0 opacity-75">Broadcast announcements or dispatch direct alerts to attendees</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <form method="POST">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="recipient" name="recipient" placeholder="Recipient" value="all@eventops.com" required>
                                <label for="recipient"><i class="bi bi-person-fill me-2"></i>Recipient Email or Group (e.g. all@eventops.com)</label>
                            </div>

                            <div class="form-floating">
                                <select class="form-select" id="channel" name="channel" required>
                                    <option value="email" selected>Email Broadcast</option>
                                    <option value="sms">SMS Text Alert</option>
                                    <option value="push">Mobile Push Notification</option>
                                </select>
                                <label for="channel"><i class="bi bi-broadcast me-2"></i>Delivery Channel</label>
                            </div>

                            <div class="form-floating">
                                <input type="text" class="form-control" id="subject" name="subject" placeholder="Subject" required>
                                <label for="subject"><i class="bi bi-chat-quote me-2"></i>Subject Line</label>
                            </div>

                            <div class="form-floating mb-4">
                                <textarea class="form-control" id="message" name="message" style="height: 140px" placeholder="Message content" required></textarea>
                                <label for="message"><i class="bi bi-envelope-paper me-2"></i>Notification Message Body</label>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill px-4 fw-semibold shadow-sm flex-grow-1">
                                    <i class="bi bi-send-fill me-1"></i> Send Broadcast
                                </button>
                                <a href="{{ url_for('admin_notifications') }}" class="btn btn-outline-secondary rounded-pill px-4">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
