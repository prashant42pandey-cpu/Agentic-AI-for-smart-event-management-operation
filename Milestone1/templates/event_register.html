{% extends "base.html" %}

{% block title %}Register for {{ event.title }} — EventOps AI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="fw-bold mb-0"><i class="bi bi-ticket-perforated text-primary me-2"></i>Event Registration</h4>
                </div>
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h5 class="fw-bold text-dark">{{ event.title }}</h5>
                        <div class="text-muted small mb-2"><i class="bi bi-calendar-event me-1"></i>{{ event.date }} at {{ event.time }}</div>
                        <div class="text-muted small"><i class="bi bi-geo-alt me-1"></i>{{ event.location }}</div>
                    </div>

                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Select Ticket Type</label>
                            <select name="ticket_type" class="form-select form-select-lg" required>
                                <option value="Standard" selected>Standard Admission (Free)</option>
                                <option value="VIP">VIP All-Access Pass</option>
                                <option value="Speaker">Speaker Pass</option>
                                <option value="Press">Press Pass</option>
                            </select>
                            <div class="form-text">Choose the badge category for your attendance.</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle"></i> Confirm Registration
                            </button>
                            <a href="{{ url_for('event_detail', event_id=event.id) }}" class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
